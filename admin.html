<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0c12" />
  <title>لوحة البلاغات | وِش الكلمة؟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">
  <div class="bg-deco" aria-hidden="true"><span></span><span></span></div>

  <main class="admin-wrap">
    <header class="admin-head">
      <div>
        <h1 class="admin-title">لوحة البلاغات</h1>
        <p class="muted small" id="whoami"></p>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>خروج</button>
    </header>

    <!-- تسجيل الدخول -->
    <section id="login" class="panel login-panel" hidden>
      <h2>دخول الأدمن</h2>
      <form id="loginForm" class="login-form">
        <label class="field">
          <span class="label">الإيميل</span>
          <input type="email" id="loginEmail" autocomplete="username" dir="ltr" required />
        </label>
        <label class="field">
          <span class="label">كلمة السر</span>
          <input type="password" id="loginPass" autocomplete="current-password" dir="ltr" required />
        </label>
        <p class="form-error" id="loginError" role="alert"></p>
        <button type="submit" class="btn btn-primary" id="loginBtn">دخول</button>
      </form>
    </section>

    <!-- لوحة البلاغات -->
    <section id="dash" hidden>
      <div class="stats">
        <div class="stat"><b id="statNew">٠</b><span>بلاغ جديد</span></div>
        <div class="stat"><b id="statWords">٠</b><span>كلمة تحتاج مراجعة</span></div>
        <div class="stat"><b id="statDone">٠</b><span>بلاغ محلول</span></div>
      </div>

      <div class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="new" aria-selected="true">جديدة</button>
          <button class="tab" role="tab" data-tab="done" aria-selected="false">محلولة</button>
        </div>
        <input type="search" id="search" placeholder="ابحث عن كلمة…" aria-label="بحث" />
        <button class="btn btn-ghost btn-sm" id="refreshBtn">تحديث</button>
      </div>

      <p class="form-error" id="dashError" role="alert"></p>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
